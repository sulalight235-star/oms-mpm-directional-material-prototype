<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目价格监管中心 - MPM</title>
  <link rel="stylesheet" href="mpm-dock-common.css">
  <style>
    :root {
      --primary: #3478e5;
      --primary-hover: #2467cf;
      --primary-soft: #edf4ff;
      --success: #67c23a;
      --success-soft: #f0f9eb;
      --danger: #f56c6c;
      --danger-soft: #fef0f0;
      --warning: #e6a23c;
      --surface: #fff;
      --page-bg: #f4f6fa;
      --line: #e8ebf0;
      --text: #303133;
      --text-2: #606266;
      --text-3: #909399;
    }
    * { box-sizing: border-box; }
    html, body { min-width: 1180px; min-height: 100%; color: var(--text); background: var(--page-bg); }
    body { overflow: hidden; }
    button, input, select, textarea { font: inherit; }
    button, a, select { touch-action: manipulation; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
      outline: 3px solid rgba(52,120,229,.22); outline-offset: 1px;
    }

    .top { height: 34px; padding: 0 10px; background: #2867d8; color: #fff; box-shadow: none; }
    .top-brand { gap: 9px; }
    .brand-logo { width: 24px; height: 24px; border-radius: 4px; background: rgba(255,255,255,.16); }
    .brand-name { font-size: 16px; font-weight: 700; }
    .switch-btn { height: 25px; padding: 0 8px; border: 0; color: #fff; line-height: 25px; }
    .switch-btn::before { content: ""; width: 7px; height: 7px; display: inline-block; margin-right: 6px; border-radius: 50%; background: #ffb55e; vertical-align: 1px; }
    .top .right { font-size: 13px; }
    .top .right span { padding: 0 10px; color: rgba(255,255,255,.96); }
    .badge-dot { top: 5px; right: 3px; border-color: #2867d8; }
    .user-avatar { display: none !important; }

    .tabs { height: 34px; padding: 0; background: #4c8cec; border-bottom: 1px solid #c5d5ed; }
    .tab { height: 34px; padding: 0 14px; background: #fff; color: #333; }
    .tab.active { color: #303133; }
    .tab.active::after { display: none; }
    .clear { height: 34px; background: #4c8cec; color: #fff; border-left-color: rgba(255,255,255,.2); }
    .operation-bar { height: 36px; display: flex; align-items: center; padding: 0 18px; color: #3374d5; font-weight: 600; background: #f5f7fb; border-bottom: 1px solid #edf0f5; }

    .app-shell { height: calc(100dvh - 104px); min-height: 620px; display: grid; grid-template-columns: 196px minmax(0,1fr); background: #fff; }
    .side-nav { border-right: 1px solid #dfe4ec; background: #fff; }
    .side-item { width: 100%; min-height: 52px; display: flex; align-items: center; padding: 0 24px; border: 0; border-right: 3px solid transparent; background: transparent; color: #303133; text-align: left; cursor: pointer; transition: color .18s,background .18s,border-color .18s; }
    .side-item:hover { color: var(--primary); background: #f6f9ff; }
    .side-item.active { border-right-color: var(--primary); background: var(--primary-soft); color: var(--primary); font-weight: 600; }

    .workspace { min-width: 0; padding: 24px 26px 30px; overflow: hidden; background: #fff; }
    .work-card { height: 100%; min-height: 560px; padding: 22px 26px; overflow: auto; border: 1px solid #e3e7ed; border-radius: 20px; background: #fff; box-shadow: 0 1px 4px rgba(32,52,84,.05); scrollbar-gutter: stable; }
    .module { display: none; min-width: 860px; }
    .module.active { display: block; }
    .module-head { min-height: 34px; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
    .module-title { margin: 0; padding-left: 10px; border-left: 4px solid var(--primary); font-size: 17px; line-height: 22px; }
    .module-title.plain { padding-left: 0; border-left: 0; }
    .head-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }

    .btn { min-height: 32px; padding: 0 14px; border: 1px solid #dcdfe6; border-radius: 2px; background: #fff; color: #606266; cursor: pointer; transition: .18s; }
    .btn:hover { border-color: #9fc0f1; color: var(--primary); background: #f7faff; }
    .btn.primary { border-color: var(--primary); background: var(--primary); color: #fff; }
    .btn.primary:hover { border-color: var(--primary-hover); background: var(--primary-hover); color: #fff; }
    .btn.link { min-height: 28px; padding: 0 6px; border-color: transparent; background: transparent; color: var(--primary); }
    .btn.link:hover { border-color: transparent; background: var(--primary-soft); }
    .btn.danger { color: var(--danger); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .icon-btn { width: 30px; min-width: 30px; padding: 0; }
    .icon { width: 15px; height: 15px; vertical-align: -3px; fill: none; stroke: currentColor; stroke-width: 1.8; }

    .filter-box { margin-bottom: 14px; padding: 12px 14px; border: 1px solid #eef0f4; background: #fff; }
    .filter-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .field { display: flex; align-items: center; gap: 8px; min-width: 245px; }
    .field label { flex: 0 0 auto; margin: 0; color: #444; font-weight: 500; white-space: nowrap; }
    .control { width: 190px; height: 32px; padding: 0 10px; border: 1px solid #dcdfe6; border-radius: 2px; background: #fff; color: #303133; transition: .18s; }
    .control:hover { border-color: #a9c6ef; }
    .control:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(52,120,229,.1); outline: 0; }
    .control::placeholder { color: #c0c4cc; }
    select.control { appearance: none; padding-right: 28px; background-image: linear-gradient(45deg,transparent 50%,#b2b7c0 50%),linear-gradient(135deg,#b2b7c0 50%,transparent 50%); background-position: calc(100% - 14px) 13px,calc(100% - 9px) 13px; background-repeat: no-repeat; background-size: 5px 5px; }
    .date-range { width: 280px; display: grid; grid-template-columns: 1fr 30px 1fr; align-items: center; border: 1px solid #dcdfe6; border-radius: 2px; }
    .date-range input { width: 100%; height: 30px; padding: 0 9px; border: 0; outline: 0; }
    .date-range span { color: #b5bac3; text-align: center; }

    .table-actions { min-height: 40px; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
    .check-label { display: inline-flex; align-items: center; gap: 7px; color: #555; cursor: pointer; }
    input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--primary); }
    .table-wrap { overflow: auto; border: 0; }
    .data-table { width: 100%; min-width: 860px; border-collapse: collapse; table-layout: fixed; }
    .data-table th, .data-table td { height: 42px; padding: 8px 10px; border: 0; border-bottom: 1px solid #edf0f4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .data-table th { background: #fafafa; color: #303133; font-weight: 600; }
    .data-table tbody tr:hover td { background: #f7faff; }
    .data-table td.wrap { white-space: normal; line-height: 1.55; }
    .data-table .actions-cell { overflow: visible; white-space: normal; }
    .tag { display: inline-flex; align-items: center; min-height: 23px; padding: 0 7px; border: 1px solid #dcdfe6; border-radius: 2px; background: #fafafa; color: #606266; font-size: 12px; }
    .tag.system { margin-left: 6px; }
    .tag.success { border-color: #d1edc4; background: var(--success-soft); color: var(--success); }
    .tag.up { border-color: #d1edc4; background: var(--success-soft); color: var(--success); }
    .tag.down { border-color: #fbc4c4; background: var(--danger-soft); color: var(--danger); }
    .formula { display: inline-flex; align-items: center; gap: 6px; color: #4c83df; }
    .status-progress { display: inline-flex; align-items: center; gap: 7px; }
    .progress-line { width: 34px; height: 5px; border-radius: 3px; background: var(--success); }
    .empty-state { height: 310px; display: grid; place-items: center; border-bottom: 1px solid #f0f2f5; color: #c0c4cc; text-align: center; }
    .empty-state svg { width: 58px; height: 58px; margin-bottom: 8px; stroke: #d8dce3; }
    .pagination { min-height: 52px; display: flex; justify-content: flex-end; align-items: center; gap: 4px; color: #606266; }
    .page-btn { min-width: 28px; height: 28px; padding: 0 7px; border: 0; background: transparent; color: #606266; cursor: pointer; }
    .page-btn.active { border: 1px solid var(--primary); color: var(--primary); background: #fff; }
    .page-btn:disabled { color: #c7cbd2; cursor: not-allowed; }

    .modal-mask { position: fixed; inset: 0; z-index: 500; display: none; align-items: center; justify-content: center; padding: 24px; background: rgba(0,0,0,.48); }
    .modal-mask.show { display: flex; }
    .dialog { width: min(690px,calc(100vw - 48px)); max-height: calc(100dvh - 48px); display: flex; flex-direction: column; overflow: hidden; border-radius: 3px; background: #fff; box-shadow: 0 16px 48px rgba(0,0,0,.25); animation: dialog-in .2s ease-out; }
    .dialog.small { width: min(520px,calc(100vw - 48px)); }
    .dialog-head { min-height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; border-bottom: 1px solid #ebeef5; }
    .dialog-title { font-size: 17px; font-weight: 600; }
    .close-btn { width: 40px; height: 40px; border: 0; background: transparent; color: #909399; font-size: 25px; cursor: pointer; }
    .dialog-body { padding: 20px 22px; overflow: auto; }
    .dialog-foot { min-height: 58px; display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 10px 22px; border-top: 1px solid #ebeef5; }
    .form-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 18px 16px; }
    .form-item.span-2 { grid-column: 1 / -1; }
    .form-item label { display: block; margin-bottom: 7px; color: #444; }
    .form-item.required label::before { content: "*"; margin-right: 4px; color: var(--danger); }
    .form-item .control { width: 100%; }
    .formula-card { grid-column: 1 / -1; padding: 14px; border: 1px solid #edf0f5; background: #fafcff; }
    .formula-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; font-weight: 600; }
    .formula-editor { min-height: 90px; padding: 12px; border: 1px solid #dcdfe6; background: #fff; color: #909399; }
    .variable-list { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .switch-line { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; padding: 12px; background: #fafafa; }
    .switch { width: 42px; height: 22px; position: relative; border: 0; border-radius: 11px; background: #c0c4cc; cursor: pointer; }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .18s; }
    .switch.on { background: var(--primary); }
    .switch.on::after { transform: translateX(20px); }
    .toast { position: fixed; left: 50%; bottom: 28px; z-index: 1000; transform: translate(-50%,16px); padding: 10px 18px; border-radius: 3px; background: rgba(32,38,47,.94); color: #fff; opacity: 0; pointer-events: none; transition: .2s; }
    .toast.show { opacity: 1; transform: translate(-50%,0); }
    @keyframes dialog-in { from { opacity: 0; transform: translateY(-8px) scale(.99); } to { opacity: 1; transform: none; } }
    @media (max-width: 1280px) { .workspace { padding: 18px; } .work-card { padding: 18px; } .field { min-width: 220px; } .control { width: 165px; } }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { transition-duration: .01ms!important; animation-duration: .01ms!important; animation-iteration-count: 1!important; } }
  </style>
</head>
<body>
  <header class="top">
    <div class="top-brand"><div class="brand-logo">咸</div><span class="brand-name">咸亨国际主数据管理平台</span><button class="switch-btn" type="button" onclick="location.href='index.html'">切换系统</button></div>
    <div class="right"><span>消息通知<i class="badge-dot"></i></span><span>价格审核<i class="badge-dot"></i></span><span class="divider"></span><span>版本更新</span><span>推送ERP</span><span>管理模块</span><span onclick="location.href='MPM-任务中心-任务列表.html'">任务中心<i class="badge-dot"></i></span><span>清洗任务<i class="badge-dot"></i></span><span>管理员 ▾</span></div>
  </header>
  <div class="tabs"><div class="tab active">项目价格监管中心 <span class="x">×</span></div><div class="clear">清除</div></div>
  <div class="operation-bar">操作：</div>

  <main class="app-shell">
    <aside class="side-nav" aria-label="项目价格监管中心功能导航">
      <button class="side-item active" type="button" data-module="warning">预警中心</button>
      <button class="side-item" type="button" data-module="pool">价格数据池</button>
      <button class="side-item" type="button" data-module="rules">规则库</button>
      <button class="side-item" type="button" data-module="customers">客户管理</button>
      <button class="side-item" type="button" data-module="audit">AI外链匹配与稽查</button>
    </aside>

    <section class="workspace">
      <div class="work-card">
        <section class="module active" id="warningModule" data-title="预警中心">
          <div class="module-head"><h1 class="module-title plain">预警中心</h1></div>
          <form class="filter-box demo-form"><div class="filter-row">
            <div class="field"><label for="warningProject">所属项目</label><select class="control" id="warningProject"><option value="">请选择</option><option>国网一级</option><option>中核电商</option><option>中国电建</option></select></div>
            <div class="field"><label for="warningType">规则类型</label><select class="control" id="warningType"><option value="">请选择</option><option>固定价比较检查</option><option>项目外链价比较检查</option><option>外部链接价比较检查</option></select></div>
            <div class="field"><label for="warningStatus">处理状态</label><select class="control" id="warningStatus"><option value="">请选择</option><option>未读</option><option>已读</option><option>已处理</option></select></div>
            <div class="field"><label>预警日期</label><div class="date-range"><input type="text" placeholder="开始日期" aria-label="预警开始日期"><span>→</span><input type="text" placeholder="结束日期" aria-label="预警结束日期"></div></div>
            <button class="btn primary" type="submit">查询</button>
          </div></form>
          <div class="table-actions"><label class="check-label"><input id="warningAll" type="checkbox">全选</label><div><button class="btn primary" type="button" onclick="showToast('所选预警已标记为已读')">标记已读</button> <button class="btn primary" type="button" onclick="showToast('预警导出任务已创建')">批量导出</button></div></div>
          <div class="empty-state"><div><svg viewBox="0 0 64 64" fill="none"><path d="M17 25h30l5 10v16H12V35l5-10Z"/><path d="M12 36h13l3 5h8l3-5h13"/><path d="M23 25l3-8h12l3 8"/></svg><div>暂无数据</div></div></div>
          <div class="pagination"><button class="page-btn" disabled>‹</button><button class="page-btn active">1</button><button class="page-btn" disabled>›</button></div>
        </section>

        <section class="module" id="poolModule" data-title="价格数据池">
          <div class="module-head"><h1 class="module-title plain">价格数据池</h1></div>
          <div style="margin-bottom:14px"><button class="btn primary" type="button" onclick="showToast('价格数据导出任务已创建')">批量导出</button></div>
          <form class="filter-box demo-form"><div class="filter-row">
            <div class="field"><label for="poolProject">所属项目</label><select class="control" id="poolProject"><option value="">请选择</option><option>国网一级</option><option>中核电商</option><option>中国电建</option></select></div>
            <div class="field" style="min-width:360px"><label for="goodsCode">商品编码</label><input class="control" style="width:260px" id="goodsCode" placeholder="请输入;多个编码英文逗号间隔"></div>
            <button class="btn primary" type="submit">查询</button>
          </div></form>
          <div class="table-wrap"><table class="data-table"><thead><tr><th style="width:100px">操作</th><th>商品编码</th><th>品牌</th><th>名称</th><th>型号</th><th>描述</th></tr></thead></table></div>
          <div class="empty-state"><div><svg viewBox="0 0 64 64" fill="none"><path d="M17 25h30l5 10v16H12V35l5-10Z"/><path d="M12 36h13l3 5h8l3-5h13"/><path d="M23 25l3-8h12l3 8"/></svg><div>暂无数据</div></div></div>
        </section>

        <section class="module" id="rulesModule" data-title="规则库">
          <div class="module-head"><h1 class="module-title">规则库</h1><button class="btn primary" type="button" onclick="openRuleDialog()">＋ 新增规则</button></div>
          <form class="filter-box demo-form"><div class="filter-row">
            <div class="field"><label for="ruleKeyword">规则名称</label><input class="control" id="ruleKeyword" placeholder="请选择"></div>
            <div class="field"><label for="ruleType">规则类型</label><select class="control" id="ruleType"><option value="">请选择</option><option>固定价比较检查</option><option>项目外链价比较检查</option><option>咸亨官网价比较检查</option></select></div>
            <button class="btn primary" type="submit">查询</button><button class="btn" type="reset">↻ 重置</button>
          </div></form>
          <div class="table-wrap"><table class="data-table"><thead><tr><th style="width:190px">规则名称</th><th style="width:180px">规则类型</th><th style="width:300px">计算公式 / 逻辑</th><th style="width:170px">浮动阈值 (上下)</th><th style="width:115px">创建时间</th><th style="width:100px">操作</th></tr></thead><tbody id="ruleBody"></tbody></table></div>
          <div class="pagination"><button class="page-btn" disabled>‹</button><button class="page-btn active">1</button><button class="page-btn">2</button><button class="page-btn">›</button></div>
        </section>

        <section class="module" id="customersModule" data-title="客户管理">
          <div class="module-head"><h1 class="module-title plain">客户管理</h1></div>
          <form class="filter-box demo-form"><div class="filter-row"><div class="field"><label for="customerName">项目名称</label><input class="control" id="customerName" placeholder="请输入"></div><button class="btn primary" type="submit">查询</button></div></form>
          <div class="table-wrap"><table class="data-table"><thead><tr><th style="width:170px">项目名称</th><th>操作</th></tr></thead><tbody id="customerBody"></tbody></table></div>
          <div class="pagination"><button class="page-btn" disabled>‹</button><button class="page-btn active">1</button><button class="page-btn">2</button><button class="page-btn">3</button><button class="page-btn">4</button><button class="page-btn">5</button><span>…</span><button class="page-btn">26</button><button class="page-btn">›</button><select class="control" aria-label="每页条数" style="width:100px"><option>10 条/页</option><option>20 条/页</option></select></div>
        </section>

        <section class="module" id="auditModule" data-title="AI外链匹配与稽查">
          <div class="module-head"><h1 class="module-title plain">AI外链匹配与稽查</h1><div class="head-actions"><button class="btn primary" type="button" onclick="openTaskDialog('单品稽查')">单品稽查</button><button class="btn primary" type="button" onclick="openTaskDialog('创建匹配任务')">创建匹配任务</button><button class="btn" type="button" onclick="showToast('已进入外链稽查任务管理视图')">外链稽查任务管理</button></div></div>
          <form class="filter-box demo-form"><div class="filter-row">
            <div class="field"><label for="taskName">任务名称</label><input class="control" id="taskName" placeholder="请输入任务名称"></div>
            <div class="field"><label for="operator">操作人</label><input class="control" id="operator" placeholder="请输入操作人"></div>
            <div class="field"><label for="taskStatus">状态</label><select class="control" id="taskStatus"><option value="">请选择</option><option>进行中</option><option>已完成</option><option>失败</option></select></div>
            <div class="field"><label>开始时间</label><div class="date-range"><input type="text" placeholder="开始日期" aria-label="任务开始日期"><span>→</span><input type="text" placeholder="结束日期" aria-label="任务结束日期"></div></div>
            <button class="btn primary" type="submit">查询</button><button class="btn" type="reset">↻ 重置</button>
          </div></form>
          <div class="table-wrap"><table class="data-table" style="min-width:1160px"><thead><tr><th style="width:295px">任务名称</th><th style="width:85px">状态</th><th style="width:110px">进度</th><th style="width:145px">开始时间</th><th style="width:145px">结束时间</th><th style="width:90px">操作人</th><th style="width:90px">任务来源</th><th style="width:100px">稽查网站</th><th style="width:210px">操作</th></tr></thead><tbody id="taskBody"></tbody></table></div>
          <div class="pagination"><button class="page-btn" disabled>‹</button><button class="page-btn active">1</button><button class="page-btn">2</button><button class="page-btn">3</button><button class="page-btn">›</button></div>
        </section>
      </div>
    </section>
  </main>

  <div class="modal-mask" id="ruleDialog" onclick="closeOnBackdrop(event,'ruleDialog')">
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="ruleDialogTitle">
      <div class="dialog-head"><div class="dialog-title" id="ruleDialogTitle">新增规则</div><button class="close-btn" type="button" aria-label="关闭" onclick="closeDialog('ruleDialog')">×</button></div>
      <form id="ruleForm"><div class="dialog-body"><div class="form-grid">
        <div class="form-item required"><label for="newRuleName">规则名称</label><input class="control" id="newRuleName" required placeholder="请输入"></div>
        <div class="form-item required"><label for="newRuleType">规则类型</label><select class="control" id="newRuleType" required><option value="">请选择</option><option>固定价比较检查</option><option>项目外链价比较检查</option><option>外部链接价比较检查</option><option>咸亨官网价比较检查</option><option>调拨价比较检查</option></select></div>
        <div class="formula-card"><div class="formula-head"><span>公式配置（基准价格）</span><button class="btn link danger" type="button" onclick="clearFormula()">清空公式</button></div><div class="formula-editor" id="formulaEditor">请点击下方变量或运算符生成公式（禁止手动输入）</div><div style="margin-top:12px;font-weight:600">可用变量清单</div><div class="variable-list"><button class="btn" type="button" onclick="addFormula('[项目协议价]')">项目协议价</button><button class="btn" type="button" onclick="addFormula('[固定清单价]')">固定清单价</button><button class="btn" type="button" onclick="addFormula('[项目外链价]')">项目外链价</button><button class="btn" type="button" onclick="addFormula('[平台外链价]')">平台外链价</button><button class="btn" type="button" onclick="addFormula('[咸亨官网价]')">咸亨官网价</button></div><div style="margin-top:12px;font-weight:600">逻辑运算符</div><div class="variable-list"><button class="btn" type="button" onclick="addFormula(' > ')">&gt;</button><button class="btn" type="button" onclick="addFormula(' < ')">&lt;</button><button class="btn" type="button" onclick="addFormula(' >= ')">&gt;=</button><button class="btn" type="button" onclick="addFormula(' <= ')">&lt;=</button><button class="btn" type="button" onclick="addFormula(' + ')">+</button><button class="btn" type="button" onclick="addFormula(' - ')">−</button></div></div>
        <div class="switch-line"><strong>浮动阈值设置</strong><span>开启 <button class="switch" id="floatSwitch" type="button" role="switch" aria-checked="false" onclick="toggleFloat()"></button></span></div>
        <div class="form-item"><label for="upValue">↑ 上浮阈值(%)</label><input class="control" id="upValue" type="number" min="0" placeholder="如: 10%" disabled></div><div class="form-item"><label for="downValue">↓ 下浮阈值(%)</label><input class="control" id="downValue" type="number" min="0" placeholder="如: 10%" disabled></div>
      </div></div><div class="dialog-foot"><button class="btn" type="button" onclick="closeDialog('ruleDialog')">取消</button><button class="btn primary" type="submit">确定</button></div></form>
    </section>
  </div>

  <div class="modal-mask" id="actionDialog" onclick="closeOnBackdrop(event,'actionDialog')"><section class="dialog small" role="dialog" aria-modal="true" aria-labelledby="actionTitle"><div class="dialog-head"><div class="dialog-title" id="actionTitle">项目配置</div><button class="close-btn" type="button" aria-label="关闭" onclick="closeDialog('actionDialog')">×</button></div><div class="dialog-body" id="actionBody"></div><div class="dialog-foot"><button class="btn" type="button" onclick="closeDialog('actionDialog')">取消</button><button class="btn primary" type="button" onclick="saveAction()">确定</button></div></section></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="mpm-topnav-links.js"></script>
  <script>
    const rules = [
      {name:'固定价',system:true,type:'固定价比较检查',formula:'[项目协议价] > [固定清单价]',threshold:'逻辑判断模式',date:'2026-01-19'},
      {name:'项目外链',system:true,type:'项目外链价比较检查',formula:'[项目外链价] < [项目协议价]',threshold:'逻辑判断模式',date:'2025-12-05'},
      {name:'外链',system:true,type:'外部链接价比较检查',formula:'[平台外链价] < [项目协议价]',threshold:'逻辑判断模式',date:'2025-12-05'},
      {name:'官网价',system:true,type:'咸亨官网价比较检查',formula:'[咸亨官网价] < [项目协议价]',threshold:'逻辑判断模式',date:'2025-12-05'},
      {name:'华电--咸亨官网比较检查1',type:'咸亨官网价比较检查',formula:'[咸亨官网价]',threshold:'<span class="tag up">↑1%</span> <span class="tag down">↓1%</span>',date:'2026-02-05'},
      {name:'测试',type:'外部链接价比较检查',formula:'[平台外链价]+[平台外链价]<=[项目协议价]',threshold:'逻辑判断模式',date:'2026-02-05'},
      {name:'华电-调拨价',type:'调拨价比较检查',formula:'[调拨价]-[项目协议价]>[项目协议价]',threshold:'逻辑判断模式',date:'2026-02-04'},
      {name:'华电-固定价比较',type:'固定价比较检查',formula:'[固定清单价]*[固定清单价]>=[项目协议价]',threshold:'逻辑判断模式',date:'2026-02-04'},
      {name:'华电-项目外链价比较检查',type:'项目外链价比较检查',formula:'[项目协议价]+[项目协议价]>[项目外链价]',threshold:'逻辑判断模式',date:'2026-02-04'},
      {name:'华电-外部链接价比较检查',type:'外部链接价比较检查',formula:'([项目协议价]+[项目协议价])>[平台外链价]',threshold:'逻辑判断模式',date:'2026-02-04'}
    ];
    const customers = ['国网一级','中核电商','昆明地铁','中国电建','乔司一号通','省管电力','中国科业','乐筑','第三监狱','中国交建'];
    const tasks = [
      ['20260409152516超级管理员1775719516240','2026-04-09 15:25:16','2026-04-09 15:25:30'],
      ['20260409143931超级管理员1775716771776','2026-04-09 14:39:31','2026-04-09 14:39:44'],
      ['20260409135036超级管理员1775713836697','2026-04-09 13:50:36','2026-04-09 13:50:45'],
      ['20260409115036超级管理员1775706636144','2026-04-09 11:50:36','2026-04-09 11:50:46'],
      ['20260409110326超级管理员1775703806738','2026-04-09 11:03:26','2026-04-09 11:03:39'],
      ['20260409084930超级管理员1775695770407','2026-04-09 08:49:32','2026-04-09 08:49:40']
    ];
    let toastTimer, lastFocus, formulaParts = [];
    function esc(value){ return String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char])); }
    const profileIcon='<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>';
    const lockIcon='<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>';
    const editIcon='<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 20 4.5-1 10-10-3.5-3.5-10 10L4 20Z"/><path d="m13.5 6.5 3.5 3.5"/></svg>';
    const deleteIcon='<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7M10 11v5m4-5v5"/></svg>';
    function renderRules(){ document.getElementById('ruleBody').innerHTML=rules.map((r,index)=>`<tr><td>${esc(r.name)}${r.system?'<span class="tag system">系统</span>':''}</td><td><span class="tag">${esc(r.type)}</span></td><td><span class="formula">${profileIcon}<span>${esc(r.formula)}</span></span></td><td>${r.threshold}</td><td>${r.date}</td><td class="actions-cell">${r.system?lockIcon:`<button class="btn link icon-btn" aria-label="编辑${esc(r.name)}" onclick="editRule(${index})">${editIcon}</button><button class="btn link danger icon-btn" aria-label="删除${esc(r.name)}" onclick="deleteRule(${index})">${deleteIcon}</button>`}</td></tr>`).join(''); }
    function renderCustomers(){ document.getElementById('customerBody').innerHTML=customers.map(name=>`<tr><td>${esc(name)}</td><td class="actions-cell">${['规则配置','外链导入','外链折扣导入','临时调拨价导入','钉钉通知配置'].map(action=>`<button class="btn link" type="button" onclick="openCustomerAction('${esc(name)}','${action}')">${action}</button>`).join('')}</td></tr>`).join(''); }
    function renderTasks(){ document.getElementById('taskBody').innerHTML=tasks.map(task=>`<tr><td><button class="btn link" type="button" onclick="showToast('正在查看任务 ${task[0]}')">${task[0]}</button></td><td><span class="tag success">已完成</span></td><td class="wrap"><span class="status-progress"><span class="progress-line"></span><b style="color:var(--success)">●</b></span><br>成功 1 / 总数 1</td><td class="wrap">${task[1].replace(' ','<br>')}</td><td class="wrap">${task[2].replace(' ','<br>')}</td><td>超级管理员</td><td class="wrap">手动<br>创建</td><td class="wrap"><span class="tag">京东</span> <span class="tag">国询</span> <span class="tag">天猫</span></td><td class="actions-cell"><button class="btn link" onclick="showToast('已打开稽查结果')">查看结果</button><button class="btn link" onclick="showToast('同步任务已提交')">↻ 同步结果</button><button class="btn link" onclick="showToast('下载任务已创建')">⇩ 下载稽查结果</button></td></tr>`).join(''); }

    function switchModule(key){ document.querySelectorAll('.side-item').forEach(button=>button.classList.toggle('active',button.dataset.module===key)); document.querySelectorAll('.module').forEach(module=>module.classList.toggle('active',module.id===key+'Module')); }
    document.querySelectorAll('.side-item').forEach(button=>button.addEventListener('click',()=>switchModule(button.dataset.module)));
    document.querySelectorAll('.demo-form').forEach(form=>{ form.addEventListener('submit',event=>{event.preventDefault();showToast('查询完成');}); form.addEventListener('reset',()=>setTimeout(()=>showToast('筛选条件已重置'),0)); });

    function openDialog(id){ lastFocus=document.activeElement; document.getElementById(id).classList.add('show'); document.body.style.overflow='hidden'; requestAnimationFrame(()=>document.querySelector(`#${id} button,#${id} input,#${id} select`).focus()); }
    function closeDialog(id){ document.getElementById(id).classList.remove('show'); document.body.style.overflow='hidden'; if(lastFocus)lastFocus.focus(); }
    function closeOnBackdrop(event,id){ if(event.target===event.currentTarget)closeDialog(id); }
    function openRuleDialog(){ document.getElementById('ruleForm').reset(); document.getElementById('ruleDialogTitle').textContent='新增规则'; formulaParts=[]; syncFormula(); document.getElementById('floatSwitch').classList.remove('on'); document.getElementById('floatSwitch').setAttribute('aria-checked','false'); document.getElementById('upValue').disabled=true; document.getElementById('downValue').disabled=true; openDialog('ruleDialog'); }
    function addFormula(part){ formulaParts.push(part); syncFormula(); }
    function clearFormula(){ formulaParts=[]; syncFormula(); }
    function syncFormula(){ const editor=document.getElementById('formulaEditor'); editor.textContent=formulaParts.length?formulaParts.join(''):'请点击下方变量或运算符生成公式（禁止手动输入）'; editor.style.color=formulaParts.length?'#4c83df':'#909399'; }
    function toggleFloat(){ const button=document.getElementById('floatSwitch'); const on=!button.classList.contains('on'); button.classList.toggle('on',on); button.setAttribute('aria-checked',String(on)); document.getElementById('upValue').disabled=!on; document.getElementById('downValue').disabled=!on; }
    function editRule(index){ const rule=rules[index]; openRuleDialog(); document.getElementById('ruleDialogTitle').textContent='编辑规则'; document.getElementById('newRuleName').value=rule.name; document.getElementById('newRuleType').value=rule.type; formulaParts=[rule.formula]; syncFormula(); }
    function deleteRule(index){ const removed=rules.splice(index,1)[0]; renderRules(); showToast(`规则「${removed.name}」已删除`); }
    document.getElementById('ruleForm').addEventListener('submit',event=>{ event.preventDefault(); const name=document.getElementById('newRuleName').value.trim(); const type=document.getElementById('newRuleType').value; if(!name||!type)return; rules.push({name,type,formula:formulaParts.join('')||'[项目协议价] > [固定清单价]',threshold:'逻辑判断模式',date:'2026-09-18'}); renderRules(); closeDialog('ruleDialog'); showToast('规则已保存'); });

    function openCustomerAction(project,action){ document.getElementById('actionTitle').textContent=action; document.getElementById('actionBody').innerHTML=`<div class="form-item"><label>项目名称</label><input class="control" style="width:100%" value="${project}" readonly></div><div class="form-item" style="margin-top:16px"><label>${action==='规则配置'?'选择规则':'选择文件'}</label>${action==='规则配置'?'<select class="control" style="width:100%"><option>固定价比较检查</option><option>项目外链价比较检查</option><option>咸亨官网价比较检查</option></select>':'<input class="control" style="width:100%;padding-top:5px" type="file">'}</div>`; openDialog('actionDialog'); }
    function openTaskDialog(title){ document.getElementById('actionTitle').textContent=title; document.getElementById('actionBody').innerHTML=`<div class="form-item required"><label>任务名称</label><input class="control" style="width:100%" placeholder="请输入任务名称"></div><div class="form-item" style="margin-top:16px"><label>稽查网站</label><div class="variable-list"><label class="check-label"><input type="checkbox" checked>京东</label><label class="check-label"><input type="checkbox" checked>国询</label><label class="check-label"><input type="checkbox" checked>天猫</label></div></div>`; openDialog('actionDialog'); }
    function saveAction(){ closeDialog('actionDialog'); showToast('配置已保存'); }
    function showToast(message){ const toast=document.getElementById('toast'); toast.textContent=message; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>toast.classList.remove('show'),2600); }
    document.addEventListener('keydown',event=>{ if(event.key==='Escape'){ const open=[...document.querySelectorAll('.modal-mask.show')].pop(); if(open)closeDialog(open.id); } });
    renderRules(); renderCustomers(); renderTasks();
  </script>
</body>
</html>
