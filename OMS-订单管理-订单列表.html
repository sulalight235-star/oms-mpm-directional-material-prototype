    .pager{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:#59616d}.selected-info{display:flex;gap:38px}.selected-info b{color:#1787b5}.pages{display:flex;align-items:center;gap:8px}.page-btn{min-width:28px;height:28px;border:1px solid transparent;background:transparent;color:#4a5058;cursor:pointer}.page-btn.active{border-color:#3291b9;color:#218bb6;background:#fff}.page-size,.jump{height:28px;border:1px solid #d3d8df;background:#fff}.page-size{padding:0 8px}.jump{width:48px;text-align:center}

  </style>

<body>
  <header class="topbar">
    <div class="top-left"><div class="brand">咸亨国际订单管理平台</div><nav class="primary-nav" aria-label="OMS业务导航"><button class="active">订单管理</button><button onclick="showToast('进入合同管理（原型）')">合同管理</button><button onclick="showToast('进入履约平台（原型）')">履约平台</button><button onclick="showToast('进入借出单管理（原型）')">借出单管理</button></nav></div>
    <div class="top-right"><button class="switch-system" onclick="location.href='index.html'">切换系统</button><div class="user-zone"><span class="user-chip">系统开发部 - 王云龙</span><span class="top-tool">待办</span><span class="top-tool">通知</span><span class="top-tool">帮助</span><span class="top-tool" onclick="showToast('退出登录（原型）')">退出</span></div></div>
  </header>
  <section class="contextbar">
    <div class="context-left"><span class="context-label">所属项目</span><select class="project-select" id="projectSelect" onchange="searchOrders()"><option value="国家官网">国家官网</option><option value="国家石油天然气管网集团">国家石油天然气管网集团</option><option value="全部项目">全部项目</option></select><button class="refresh-btn" title="刷新" aria-label="刷新订单" onclick="resetFilters()">↻</button><a class="help-link" href="javascript:void(0)" onclick="showToast('打开履约平台项目使用说明')">如何增加使用履约平台的项目？</a></div>
    <div class="quick-links"><button onclick="location.href='MPM-工作台-首页.html?account=wang&amp;view=project-material-pool'">项目物料池</button><button onclick="showToast('进入售后管理')">售后管理(0)</button><button onclick="showToast('进入发票中心')">发票中心（2）</button><button onclick="showToast('进入旧版履约平台')">履约平台（旧）</button><button onclick="showToast('进入供应商管理')">供应商管理</button><button onclick="showToast('进入报备单')">报备单</button><button onclick="showToast('进入履约信息字段管理')">履约信息字段管理</button></div>
  </section>
  <main class="page">
    <section class="filter-panel">
      <div class="filter-head"><div class="filter-title">订单信息 <span class="scheme">搜索方案：<span class="scheme-chip">缺省</span></span></div><div class="filter-head-actions"><button class="light-btn" onclick="showToast('管理搜索方案')">管理方案</button><button class="light-btn" onclick="showToast('添加搜索方案')">添加方案</button></div></div>
      <form class="filter-form" onsubmit="searchOrders(event)"><label for="customerOrder">客户订单号</label><input class="control" id="customerOrder" placeholder="请输入"><label for="xhOrder">咸亨订单号</label><input class="control" id="xhOrder" placeholder="请输入"><label for="projectCode">项目编码</label><input class="control" id="projectCode" placeholder="请输入"><label for="statusFilter">订单状态</label><select class="control" id="statusFilter"><option value="">请选择</option><option>预占</option><option>已取消</option></select><div class="filter-actions"><button class="btn" type="submit">⌕ 查询</button><button class="btn secondary" type="button" onclick="resetFilters()">↻ 重置</button></div></form>
    </section>
    <section class="list-area">
      <div class="list-toolbar"><div class="toolbar-left"><button class="btn" onclick="batchAction('通知业务员')">通知业务员</button><button class="btn" onclick="batchAction('重新执行')">重新执行</button><button class="btn danger" onclick="batchAction('终止任务')">终止任务</button></div><div class="list-title">☷ 订单列表</div><div class="toolbar-right"><button class="btn" onclick="batchAction('标记')">标记 ▾</button><button class="btn" onclick="batchAction('完结订单')">完结订单</button><button class="btn" onclick="batchAction('转单')">转单</button><button class="btn" onclick="batchAction('拉取订单')">拉取订单</button><button class="btn" onclick="batchAction('批量派单')">批量派单</button><button class="btn" onclick="showToast('打开订单导入')">导入订单 ▾</button><button class="btn" onclick="showToast('订单导出任务已创建')">订单导出</button></div></div>
      <div class="table-wrap"><table class="order-table"><thead><tr><th class="check"><input id="selectAll" type="checkbox" aria-label="全选" onchange="toggleAll(this.checked)"></th><th class="order">客户订单号</th><th class="order">咸亨订单号</th><th class="company">开票方</th><th class="small">开票状态</th><th class="small">回款状态</th><th class="money">平台总价</th><th class="money">应收金额</th><th class="money">未订货金额</th><th class="company">售达方</th><th class="small">收货人</th><th class="address">省市区</th><th class="small">转单公司</th><th class="small">状态</th><th class="small">自动履约</th><th class="small">派单状态</th><th class="sales">订单所属销售</th><th class="sales">订单所属销售助理</th><th class="action">操作</th></tr></thead><tbody id="orderBody"></tbody></table></div>
      <footer class="pager"><div class="selected-info"><span>已选：<b id="selectedCount">0</b>条数据</span><strong>平台总价<span id="selectedAmount">0</span></strong></div><div class="pages"><span>共 57244 条</span><button class="page-btn">‹</button><button class="page-btn active">1</button><button class="page-btn">2</button><button class="page-btn">3</button><button class="page-btn">4</button><button class="page-btn">5</button><span>…</span><button class="page-btn">1909</button><button class="page-btn">›</button><select class="page-size"><option>30 条/页</option><option>50 条/页</option></select><span>跳至</span><input class="jump" type="number" min="1"><span>页</span></div></footer>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal-mask" id="detailModal" hidden onclick="closeDetailByMask(event)"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><div class="modal-head"><h2 id="detailTitle">订单详情</h2><button class="modal-close" aria-label="关闭" onclick="closeDetail()">×</button></div><div class="modal-grid" id="detailGrid"></div><div class="modal-foot"><button class="btn secondary" onclick="closeDetail()">关闭</button></div></section></div>
  <script>
    const orders=[
      ['EP70146600','OMS20260902001','国家管网集团广东省管网有限公司','未开票','未回款',52.2,52.2,52.2,'国家管网集团','欧靖怡','广东省广州市黄埔区','-','预占','-','未派单','王云龙','范昕瑶'],
      ['EP70146596','OMS20260902002','国家石油天然气管网集团有限公司','未开票','未回款',3541,3541,3541,'国家石油天然气管网集团','谢国彬','广东省湛江市霞山区','-','预占','-','未派单','王云龙','范昕瑶'],
      ['EP70146592','OMS20260902003','国家石油天然气管网集团有限公司','未开票','未回款',557800,557800,557800,'国家石油天然气管网集团','张富裕','云南省昆明市西山区','-','预占','-','未派单','王云龙','-'],
      ['EP70146591','OMS20260902004','国家管网集团东部原油储运有限公司','未开票','未回款',1500,1500,1500,'国家管网集团','白庆相','江苏省徐州市铜山区','-','预占','-','未派单','王云龙','-'],
      ['EP70146585','OMS20260902005','国家管网集团北方管道有限责任公司','未开票','未回款',358,358,358,'国家管网集团','张瑜','河北省石家庄市长安区','-','预占','-','未派单','王云龙','范昕瑶'],
      ['EP70146584','OMS20260902006','国家管网集团西南管道有限责任公司','未开票','未回款',48100,48100,48100,'国家管网集团','李晓彤','贵州省贵阳市花溪区','-','预占','-','未派单','王云龙','范昕瑶'],
      ['EP70146582','OMS20260902007','国家管网集团东部原油储运有限公司','未开票','未回款',235,235,235,'国家管网集团','周嗣翔','浙江省湖州市长兴县','-','预占','-','未派单','王云龙','-'],
      ['EP70146578','OMS20260902008','国家管网集团东部原油储运有限公司','未开票','未回款',6275,6275,6275,'国家管网集团','金韬','浙江省湖州市吴兴区','-','预占','-','未派单','王云龙','-'],
      ['EP70146575','OMS20260902009','国家管网集团东部原油储运有限公司','未开票','未回款',200,200,200,'国家管网集团','金韬','浙江省湖州市吴兴区','-','预占','-','未派单','王云龙','-'],
      ['EP70146573','OMS20260902010','国家管网集团东部原油储运有限公司','未开票','未回款',200,0,0,'国家管网集团','金韬','浙江省湖州市吴兴区','-','已取消','-','未派单','王云龙','-'],
      ['EP70146571','OMS20260902011','国家管网集团东部原油储运有限公司','未开票','未回款',200,0,0,'国家管网集团','金韬','浙江省湖州市吴兴区','-','已取消','-','未派单','王云龙','-'],
      ['EP70146569','OMS20260902012','国家管网集团东部原油储运有限公司','未开票','未回款',6475,0,0,'国家管网集团','金韬','浙江省湖州市吴兴区','-','已取消','-','未派单','王云龙','-']
    ].map((row,index)=>({id:index+1,customer:row[0],xh:row[1],invoiceCompany:row[2],invoiceStatus:row[3],paymentStatus:row[4],total:row[5],receivable:row[6],unordered:row[7],soldTo:row[8],receiver:row[9],address:row[10],transfer:row[11],status:row[12],auto:row[13],dispatch:row[14],sales:row[15],assistant:row[16]}));
    let filtered=[...orders],selected=new Set(),toastTimer;
    const money=value=>Number(value).toLocaleString('zh-CN',{maximumFractionDigits:2});
    const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    function render(){document.getElementById('orderBody').innerHTML=filtered.map(row=>`<tr><td><input type="checkbox" ${selected.has(row.id)?'checked':''} aria-label="选择订单${escapeHtml(row.customer)}" onchange="toggleRow(${row.id},this.checked)"></td><td>${row.customer}</td><td>${row.xh}</td><td title="${escapeHtml(row.invoiceCompany)}">${escapeHtml(row.invoiceCompany)}</td><td>${row.invoiceStatus}</td><td>${row.paymentStatus}</td><td>${money(row.total)}</td><td>${money(row.receivable)}</td><td>${money(row.unordered)}</td><td title="${escapeHtml(row.soldTo)}">${escapeHtml(row.soldTo)}</td><td>${row.receiver}</td><td class="address">${row.address}</td><td>${row.transfer}</td><td class="${row.status==='已取消'?'status-cancelled':''}">${row.status}</td><td>${row.auto}</td><td>${row.dispatch}</td><td>${row.sales}</td><td>${row.assistant}</td><td class="action"><button class="view-btn" title="查看订单" aria-label="查看订单${row.customer}" onclick="openDetail(${row.id})">◎</button></td></tr>`).join('');syncSelection()}
    function searchOrders(event){event?.preventDefault();const customer=document.getElementById('customerOrder').value.trim().toLowerCase(),xh=document.getElementById('xhOrder').value.trim().toLowerCase(),status=document.getElementById('statusFilter').value;filtered=orders.filter(row=>(!customer||row.customer.toLowerCase().includes(customer))&&(!xh||row.xh.toLowerCase().includes(xh))&&(!status||row.status===status));selected.clear();render();showToast(`查询完成，共找到 ${filtered.length} 条演示数据`)}
    function resetFilters(){document.getElementById('customerOrder').value='';document.getElementById('xhOrder').value='';document.getElementById('projectCode').value='';document.getElementById('statusFilter').value='';filtered=[...orders];selected.clear();render();showToast('筛选条件已重置')}
    function toggleRow(id,checked){checked?selected.add(id):selected.delete(id);syncSelection()}
    function toggleAll(checked){filtered.forEach(row=>checked?selected.add(row.id):selected.delete(row.id));render()}
    function syncSelection(){document.getElementById('selectedCount').textContent=selected.size;document.getElementById('selectedAmount').textContent=money(orders.filter(row=>selected.has(row.id)).reduce((sum,row)=>sum+row.total,0));const all=document.getElementById('selectAll');all.checked=filtered.length>0&&filtered.every(row=>selected.has(row.id));all.indeterminate=!all.checked&&filtered.some(row=>selected.has(row.id))}
    function batchAction(name){if(!selected.size){showToast(`请先选择需要${name}的订单`);return}showToast(`${name}：已选择 ${selected.size} 条订单（原型）`)}
    function openDetail(id){const row=orders.find(item=>item.id===id);document.getElementById('detailTitle').textContent=`订单详情 - ${row.customer}`;const fields=[['客户订单号',row.customer],['咸亨订单号',row.xh],['开票方',row.invoiceCompany],['订单状态',row.status],['平台总价',money(row.total)],['应收金额',money(row.receivable)],['售达方',row.soldTo],['收货人',row.receiver],['收货区域',row.address],['派单状态',row.dispatch],['所属销售',row.sales],['销售助理',row.assistant]];document.getElementById('detailGrid').innerHTML=fields.map(field=>`<div class="detail"><label>${field[0]}</label><span>${escapeHtml(field[1])}</span></div>`).join('');document.getElementById('detailModal').hidden=false}
    function closeDetail(){document.getElementById('detailModal').hidden=true}
    function closeDetailByMask(event){if(event.target.id==='detailModal')closeDetail()}
    function showToast(text){const toast=document.getElementById('toast');toast.textContent=text;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1800)}
    document.addEventListener('keydown',event=>{if(event.key==='Escape')closeDetail()});
    render();
  </script>
</body>
</html>
