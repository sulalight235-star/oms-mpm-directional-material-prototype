<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>任务中心 - 咸亨国际主数据管理平台</title>
  <style>
    :root {
      --primary: #1677ff;
      --primary-hover: #4096ff;
      --primary-bg: #e6f4ff;
      --success: #52c41a;
      --success-bg: #f6ffed;
      --success-border: #b7eb8f;
      --warning: #faad14;
      --warning-bg: #fffbe6;
      --warning-border: #ffe58f;
      --error: #ff4d4f;
      --error-bg: #fff1f0;
      --error-border: #ffccc7;
      --text-title: rgba(0,0,0,0.88);
      --text-body: rgba(0,0,0,0.65);
      --text-sub: rgba(0,0,0,0.45);
      --text-light: rgba(0,0,0,0.30);
      --border: #d9d9d9;
      --border-light: #f0f0f0;
      --bg-layout: #f5f5f5;
      --bg-container: #ffffff;
      --bg-table-head: #fafafa;
      --radius: 6px;
      --radius-sm: 4px;
      --shadow: 0 1px 2px rgba(0,0,0,0.06), 0 1px 6px rgba(0,0,0,0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      font-size: 14px;
      background: var(--bg-layout);
      color: var(--text-body);
      min-width: 1280px;
    }
    a { color: inherit; text-decoration: none; }
    button, input, select { font: inherit; }

    /* ── 顶栏 ── */
    .topbar {
      height: 48px;
      background: #001529;
      color: rgba(255,255,255,0.85);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: sticky;
      top: 0;
      z-index: 120;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo {
      width: 28px;
      height: 28px;
      background: var(--primary);
      border-radius: 6px;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }
    .brand-name { font-size: 16px; font-weight: 600; color: #fff; white-space: nowrap; }
    .switch-btn {
      border: 1px solid rgba(255,255,255,0.25);
      background: transparent;
      color: rgba(255,255,255,0.75);
      border-radius: var(--radius);
      padding: 3px 10px;
      font-size: 12px;
      cursor: pointer;
      line-height: 22px;
      transition: all .2s;
    }
    .switch-btn:hover { border-color: var(--primary); color: #fff; }
    .nav-menu { display: flex; align-items: center; height: 100%; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 0 13px;
      height: 100%;
      font-size: 13px;
      color: rgba(255,255,255,0.75);
      cursor: pointer;
      position: relative;
      white-space: nowrap;
      transition: .2s;
    }
    .nav-item:hover { color: #fff; background: rgba(255,255,255,0.08); }
    .nav-item.active { color: #fff; background: rgba(255,255,255,0.1); }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--error); position: absolute; top: 10px; right: 7px; border: 1.5px solid #001529; }
    .nav-divider { width: 1px; height: 16px; background: rgba(255,255,255,0.15); margin: 0 3px; }
    .user-avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 11px; font-weight: 600; display: grid; place-items: center; }

    /* ── 标签页 ── */
    .tabs-bar {
      height: 36px;
      background: var(--bg-container);
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      padding: 0 8px 0 0;
      position: sticky;
      top: 48px;
      z-index: 110;
    }
    .tabs-list { display: flex; align-items: stretch; overflow-x: auto; scrollbar-width: none; }
    .tabs-list::-webkit-scrollbar { display: none; }
    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 14px;
      font-size: 12px;
      color: var(--text-sub);
      cursor: pointer;
      border-right: 1px solid var(--border-light);
      white-space: nowrap;
      transition: .2s;
      position: relative;
    }
    .tab:hover { color: var(--text-body); background: #fafafa; }
    .tab.active { color: var(--primary); background: var(--primary-bg); }
    .tab.active::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--primary); }
    .tab .cls { font-size: 10px; opacity: .5; padding: 2px; border-radius: 2px; }
    .tab:hover .cls { opacity: .85; }
    .tab .cls:hover { background: rgba(0,0,0,0.08); color: var(--error); }
    .tabs-clear { display: flex; align-items: center; padding: 0 12px; font-size: 12px; color: var(--text-sub); cursor: pointer; border-left: 1px solid var(--border-light); }
    .tabs-clear:hover { color: var(--primary); }

    /* ── 主体 ── */
    .page { padding: 12px 16px 24px; }

    /* ── 筛选区 ── */
    .filter-card {
      background: var(--bg-container);
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow);
      margin-bottom: 8px;
    }
    .filter-row {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(220px, 1fr) minmax(280px, 1.4fr) minmax(220px, 1fr) auto;
      gap: 12px 16px;
      align-items: center;
    }
    .filter-item { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .filter-item .lbl { width: 72px; flex-shrink: 0; font-size: 13px; color: var(--text-body); text-align: right; }
    .filter-item .lbl::before { content: ''; display: inline-block; width: 12px; height: 12px; vertical-align: -1px; margin-right: 2px; }
    .f-input, .f-select, .f-daterange {
      width: 100%;
      height: 32px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0 11px;
      font-size: 13px;
      outline: none;
      color: var(--text-body);
      background: var(--bg-container);
      transition: border .2s, box-shadow .2s;
    }
    .f-input::placeholder { color: var(--text-light); }
    .f-input:focus, .f-select:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(22,119,255,0.1); }
    .f-daterange {
      display: flex;
      align-items: center;
      padding: 0 11px;
      gap: 8px;
      color: var(--text-light);
      font-size: 12px;
    }
    .f-daterange input {
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      font-size: 13px;
      color: var(--text-body);
      padding: 0;
    }
    .f-daterange .arrow { color: var(--text-light); }
    .filter-actions { display: flex; align-items: center; gap: 8px; justify-self: end; }
    .icon-btn {
      width: 32px;
      height: 32px;
      border: 1px solid var(--border);
      background: var(--bg-container);
      border-radius: var(--radius);
      cursor: pointer;
      color: var(--text-sub);
      display: grid;
      place-items: center;
      font-size: 14px;
      transition: .2s;
    }
    .icon-btn:hover { color: var(--primary); border-color: var(--primary); }
    .btn {
      height: 32px;
      padding: 0 16px;
      border: 1px solid var(--border);
      background: var(--bg-container);
      color: var(--text-body);
      border-radius: var(--radius);
      cursor: pointer;
      transition: .2s;
      font-size: 13px;
    }
    .btn:hover { color: var(--primary); border-color: var(--primary); }
    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); color: #fff; }

    /* ── 列表容器 ── */
    .table-panel {
      background: var(--bg-container);
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .sub-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border-light);
    }
    .sub-toolbar-left { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-sub); }
    .sub-toolbar-right { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .btn-link {
      background: none;
      border: 0;
      color: var(--primary);
      cursor: pointer;
      padding: 4px 6px;
      font-size: 12px;
      border-radius: var(--radius-sm);
    }
    .btn-link:hover { background: var(--primary-bg); }
    .muted { color: var(--text-sub); }
    .muted-light { color: var(--text-light); }

    .table-wrap {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    thead th {
      background: var(--bg-table-head);
      color: var(--text-title);
      font-weight: 500;
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border-light);
      white-space: nowrap;
      position: sticky;
      top: 0;
    }
    tbody td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--border-light);
      color: var(--text-body);
      vertical-align: middle;
      white-space: nowrap;
    }
    tbody tr:hover td { background: #fafbfc; }
    .td-link {
      color: var(--primary);
      cursor: pointer;
    }
    .td-link:hover { text-decoration: underline; }

    /* 状态徽标 */
    .status-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      padding: 2px 10px;
      border-radius: 12px;
      border: 1px solid;
      line-height: 18px;
    }
    .status-tag::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }
    .status-success { background: var(--success-bg); color: var(--success); border-color: var(--success-border); }
    .status-success::before { background: var(--success); }
    .status-fail { background: var(--error-bg); color: var(--error); border-color: var(--error-border); }
    .status-fail::before { background: var(--error); }
    .status-running { background: var(--primary-bg); color: var(--primary); border-color: #91caff; }
    .status-running::before { background: var(--primary); }

    /* 分页 */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-top: 1px solid var(--border-light);
      font-size: 12px;
      color: var(--text-sub);
    }
    .pagination-right { display: flex; align-items: center; gap: 4px; }
    .page-btn {
      min-width: 28px;
      height: 28px;
      padding: 0 8px;
      border: 1px solid var(--border);
      background: var(--bg-container);
      color: var(--text-body);
      cursor: pointer;
      border-radius: var(--radius-sm);
      font-size: 12px;
    }
    .page-btn:hover { color: var(--primary); border-color: var(--primary); }
    .page-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .page-ellipsis { padding: 0 6px; color: var(--text-light); }

    /* 消息提示 */
    .message-wrap {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      pointer-events: none;
    }
    .message-item {
      background: #fff;
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-title);
      transform: translateY(-12px);
      opacity: 0;
      transition: all .2s ease;
    }
    .message-item.show { opacity: 1; transform: translateY(0); }
    .message-item.success { border-color: var(--success-border); color: var(--success); }
    .message-item.warning { border-color: var(--warning-border); color: var(--warning); }
    .message-item.error { border-color: var(--error-border); color: var(--error); }
  </style>
</head>

      <div class="nav-item" data-name="价格审核">价格审核<span class="badge-dot"></span></div>
      <div class="nav-divider"></div>
      <div class="nav-item" data-name="版本更新">版本更新</div>
      <div class="nav-item" data-name="推送ERP">推送ERP</div>

          </select>
        </div>
        <div class="filter-item">
          <span class="lbl">状态</span>
          <select id="filterStatus" class="f-select">
            <option value="">请选择</option>
            <option>成功</option>
            <option>失败</option>
            <option>处理中</option>
          </select>
        </div>
        <div class="filter-item">
          <span class="lbl">时间范围</span>
          <div class="f-daterange">
            <input type="text" placeholder="请选择" id="filterStart" />
            <span class="arrow">→</span>
            <input type="text" placeholder="请选择" id="filterEnd" />
            <span style="font-size:14px;">📅</span>
          </div>
        </div>
        <div class="filter-item">
          <span class="lbl">文件名</span>
          <input class="f-input" placeholder="请输入" id="filterFileName" />
        </div>
        <div class="filter-actions">
          <button class="icon-btn" type="button" title="高级筛选">✎</button>
          <button class="btn btn-primary" type="button" id="searchBtn">查 询</button>
          <button class="btn" type="button" id="resetBtn">重 置</button>
          <button class="icon-btn" type="button" title="收起" style="border:0;background:transparent;">⌃</button>
        </div>
      </form>
    </section>

    <!-- 表格 -->
    <section class="table-panel">
      <div class="sub-toolbar">
        <div class="sub-toolbar-left">操作：</div>
        <div class="sub-toolbar-right">
          <button class="btn-link" type="button" id="refreshBtn">刷新</button>
        </div>
      </div>

      <div class="table-wrap">
        <table>

            <tr>

              <th>类型</th>
              <th>任务编码</th>
              <th>开始时间</th>

              <th>完成时间</th>
              <th>创建人</th>
              <th>导入文件</th>
              <th>导出文件</th>
            </tr>
          </thead>
          <tbody id="taskTableBody">
            <!-- JS 渲染 -->
          </tbody>
        </table>
      </div>

      <!-- 分页 -->
      <div class="pagination">
        <div class="pagination-left">共 <strong id="totalCount">284,654</strong> 条</div>
        <div class="pagination-right">
          <button class="page-btn" type="button" data-page="prev">‹</button>
          <button class="page-btn active" type="button">1</button>
          <button class="page-btn" type="button">2</button>
          <button class="page-btn" type="button">3</button>
          <button class="page-btn" type="button">4</button>
          <button class="page-btn" type="button">5</button>
          <span class="page-ellipsis">…</span>
          <button class="page-btn" type="button">14233</button>
          <button class="page-btn" type="button" data-page="next">›</button>
        </div>
      </div>
    </section>
  </main>

      el.className = `message-item ${type}`;
      el.textContent = text;
      wrap.appendChild(el);
      requestAnimationFrame(() => el.classList.add('show'));
      setTimeout(() => {
        el.classList.remove('show');
        setTimeout(() => el.remove(), 250);
      }, 2200);

    /* ── 渲染 ── */
    function statusTagHtml(status) {
      if (status === '成功') return '<span class="status-tag status-success">成功</span>';
      if (status === '失败') return '<span class="status-tag status-fail">失败</span>';
      return '<span class="status-tag status-running">处理中</span>';
    }
    function linkOrDash(text) {
      if (!text) return '<span class="muted-light">无</span>';
      return `<a class="td-link" href="javascript:void(0)" title="${text}">${text}</a>`;
    }

    const tbody = document.getElementById('taskTableBody');
    function renderRows(rows) {
      if (!rows.length) {
        tbody.innerHTML = `<tr><td colspan="11" style="text-align:center;padding:48px 0;color:var(--text-sub);">没有符合条件的任务</td></tr>`;
        return;
      }
      tbody.innerHTML = rows.map(t => `
        <tr>
          <td>${statusTagHtml(t.status)}</td>
          <td><a class="td-link" href="javascript:void(0)">${t.type}</a></td>
          <td><span class="muted">${t.code}</span></td>
          <td>${t.start}</td>
          <td>${t.used}</td>
          <td>${t.remain}</td>
          <td>${t.progress}</td>
          <td>${t.done || '<span class="muted-light">-</span>'}</td>
          <td>${t.creator}</td>
          <td>${linkOrDash(t.importFile)}</td>
          <td>${linkOrDash(t.exportFile)}</td>
        </tr>
      `).join('');
    }
    renderRows(taskMock);

    /* ── 筛选 ── */
    document.getElementById('searchBtn').addEventListener('click', () => {
      const type = document.getElementById('filterType').value;
      const status = document.getElementById('filterStatus').value;
      const fileName = document.getElementById('filterFileName').value.trim();
      const filtered = taskMock.filter(t => {
        if (type && t.type !== type) return false;
        if (status && t.status !== status) return false;
        if (fileName && !(t.importFile.includes(fileName) || t.exportFile.includes(fileName))) return false;
        return true;
      });
      renderRows(filtered);
      showMessage(`查询完成，命中 ${filtered.length} 条`, 'success');
    });
    document.getElementById('resetBtn').addEventListener('click', () => {
      document.getElementById('filterType').value = '';
      document.getElementById('filterStatus').value = '';
      document.getElementById('filterStart').value = '';
      document.getElementById('filterEnd').value = '';
      document.getElementById('filterFileName').value = '';
      renderRows(taskMock);
      showMessage('已重置筛选条件', 'info');
    });
    document.getElementById('refreshBtn').addEventListener('click', () => {
      renderRows(taskMock);
      showMessage('已刷新任务列表', 'success');
    });

    /* ── 页签 / 顶部导航 跳转 ── */
    document.getElementById('clearTabs').addEventListener('click', () => {
      showMessage('已清除其它页签', 'success');
    });
    document.querySelectorAll('.nav-item').forEach(nav => {
      const name = nav.dataset.name;
      if (name === '管理员') return;
      nav.addEventListener('click', () => {
        if (name === '任务中心') return; // 当前页
        showMessage(`「${name}」入口暂未在原型中实现`, 'info');
      });
    });
  </script>
