eriesGo" type="button">确定</button></div></div></section><details class="series-demo"><summary>原型演示设置与待确认规则</summary><p>数据仅保存在当前浏览器。样例 001、002 含物料引用，可演示禁用、删除阻断；003 无引用且禁用，可演示启用。</p><label>演示权限 <select id="seriesPermission" class="proto-select" style="width:auto"><option value="manage">字典管理员</option><option value="read">仅查看</option></select></label><p>批量部分冲突演示采用整批不变；已引用系列暂不允许更换组织；组织范围暂不做跨组织推断。最终规则仍按 PRD 待确认项定稿。</p></details></main><div aria-live="polite" class="prototype-live-region" id="prototype-announcer"></div><script src="assets/js/prototype-common.js"></script><script src="assets/js/mpm-product-series.js?v=20261109-numeric"></script></body></html>
